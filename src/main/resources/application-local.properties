app.environment=local
app.persistence=memory
server.address=0.0.0.0
server.port=${PORT:8080}
security.jwt.secret=${JWT_SECRET:local-dev-secret-change-me-please-32chars}
auth.stage-access.enabled=true
auth.stage-access.pin=111111
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
admin.auth.email=${ADMIN_EMAIL:a@gmail.com}
admin.auth.password=${ADMIN_PASSWORD:88888888}
media.storage.root-dir=${MEDIA_ROOT_DIR:./data/media}
media.public-base-url=${MEDIA_PUBLIC_BASE_URL:http://localhost:8080}
spring.servlet.multipart.max-file-size=512MB
spring.servlet.multipart.max-request-size=512MB
server.tomcat.max-http-form-post-size=512MB
server.tomcat.max-swallow-size=512MB
server.tomcat.max-part-count=50
spring.autoconfigure.exclude=\
org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration,\
org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
