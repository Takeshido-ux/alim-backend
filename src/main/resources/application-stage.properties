app.environment=stage
app.persistence=jdbc
server.address=0.0.0.0
server.port=${PORT:8080}
server.forward-headers-strategy=framework
security.jwt.secret=${JWT_SECRET}
auth.stage-access.enabled=true
auth.stage-access.pin=111111
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
admin.auth.email=${ADMIN_EMAIL:a@gmail.com}
admin.auth.password=${ADMIN_PASSWORD:88888888}
media.storage.root-dir=${MEDIA_ROOT_DIR:./data/media}
media.public-base-url=${MEDIA_PUBLIC_BASE_URL:http://localhost:8080}
spring.servlet.multipart.max-file-size=512MB
spring.servlet.multipart.max-request-size=512MB
server.tomcat.max-http-form-post-size=512MB
server.tomcat.max-swallow-size=512MB
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/learning}
spring.datasource.username=${DATABASE_USERNAME:learning}
spring.datasource.password=${DATABASE_PASSWORD:learning}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
