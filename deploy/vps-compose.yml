# Cheap RU VPS (Timeweb / Aeza / FirstVDS): same stack as before.
#   docker compose -f deploy/vps-compose.yml up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: learning
      POSTGRES_USER: learning
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learning -d learning"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:?set MEDIA_PUBLIC_BASE_URL}
      MEDIA_ROOT_DIR: /data/media
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-a@gmail.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-88888888}
      DATABASE_URL: jdbc:postgresql://db:5432/learning
      DATABASE_USERNAME: learning
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - media_data:/data/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  media_data:
