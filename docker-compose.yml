services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: learning
      POSTGRES_USER: learning
      POSTGRES_PASSWORD: learning
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learning -d learning"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: "8080"
      JWT_SECRET: local-dev-secret-change-me-please-32chars
      MEDIA_PUBLIC_BASE_URL: http://localhost:8080
      MEDIA_ROOT_DIR: /data/media
      CORS_ALLOWED_ORIGINS: "*"
      ADMIN_EMAIL: a@gmail.com
      ADMIN_PASSWORD: "88888888"
      DATABASE_URL: jdbc:postgresql://db:5432/learning
      DATABASE_USERNAME: learning
      DATABASE_PASSWORD: learning
    volumes:
      - media_data:/data/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  media_data:
